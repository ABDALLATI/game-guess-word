<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <h1></h1>
    <div class="container">
        <div class="words">
            <div class="inputs"></div>
            <div class="control">
                <button class="check">Check Word</button>
                <button class="hint"><span></span> Hint</button>
            </div>
            <div class="message"></div>
        </div>
        <div class="colors">
            <h2>Key Colors</h2>
            <div class="color">
                <div class="color-box in-place"></div>
                <span>Letter Is Correct And In Place</span>
            </div>
            <div class="color">
                <div class="color-box not-in-place"></div>
                <span>Letter Is In Word But Not In Place</span>
            </div>
            <div class="color">
                <div class="color-box wrong"></div>
                <span>Letter Is Not In Word</span>
            </div>
        </div>
    </div>
    <footer></footer>
    <script src="js/main.js"></script>
</body>
</html>
